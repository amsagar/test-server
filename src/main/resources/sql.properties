CHAT.SESSION.CREATE=INSERT INTO chat_session (title, assistant_id, created_at, updated_at) VALUES (?, ?::uuid, ?, ?)
CHAT.SESSION.FIND_BY_ARCHIVED=SELECT * FROM chat_session WHERE archived = ? ORDER BY updated_at DESC
CHAT.SESSION.FIND_BY_ID=SELECT * FROM chat_session WHERE id = ?::uuid
CHAT.SESSION.UPDATE_TITLE=UPDATE chat_session SET title = ?, updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.UPDATE_ARCHIVED=UPDATE chat_session SET archived = ?, updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.TOUCH=UPDATE chat_session SET updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.DELETE=DELETE FROM chat_session WHERE id = ?::uuid

ASSISTANT.CREATE=INSERT INTO assistant (name, system_prompt, builtin_tools, created_at, updated_at) VALUES (?, ?, ?, ?, ?)
ASSISTANT.FIND_ALL=SELECT * FROM assistant ORDER BY created_at ASC
ASSISTANT.FIND_BY_ID=SELECT * FROM assistant WHERE id = ?::uuid
ASSISTANT.FIND_BY_NAME=SELECT * FROM assistant WHERE name = ?
ASSISTANT.UPDATE=UPDATE assistant SET name = ?, system_prompt = ?, builtin_tools = ?, updated_at = ? WHERE id = ?::uuid
ASSISTANT.DELETE=DELETE FROM assistant WHERE id = ?::uuid

TOOL.CREATE=INSERT INTO agent_tool (name, description, method, host, endpoint, request_schema, source_type, auth_profile_id, auth_type, auth_config, enabled, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?::uuid, ?, ?, ?, ?, ?)
TOOL.FIND_ALL=SELECT * FROM agent_tool ORDER BY created_at ASC
TOOL.FIND_BY_ID=SELECT * FROM agent_tool WHERE id = ?::uuid
TOOL.FIND_BY_ASSISTANT=SELECT t.* FROM agent_tool t JOIN assistant_agent_tool a ON a.tool_id = t.id WHERE a.assistant_id = ?::uuid AND t.enabled = TRUE
TOOL.UPDATE=UPDATE agent_tool SET name = ?, description = ?, method = ?, host = ?, endpoint = ?, request_schema = ?, auth_profile_id = ?::uuid, auth_type = ?, auth_config = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
TOOL.DELETE=DELETE FROM agent_tool WHERE id = ?::uuid
TOOL.FIND_EMBEDDING_HASH=SELECT embedding_hash FROM agent_tool WHERE id = ?::uuid
TOOL.UPDATE_EMBEDDING=UPDATE agent_tool SET embedding = ?::vector, embedding_hash = ? WHERE id = ?::uuid
TOOL.FIND_MISSING_EMBEDDING=SELECT id, name, description FROM agent_tool WHERE embedding IS NULL
TOOL.SIMILARITY_BY_ASSISTANT=SELECT t.name AS name, 1 - (t.embedding <=> ?::vector) AS score FROM agent_tool t JOIN assistant_agent_tool a ON a.tool_id = t.id WHERE a.assistant_id = ?::uuid AND t.enabled = TRUE AND t.embedding IS NOT NULL

ASSISTANT.TOOL.CLEAR=DELETE FROM assistant_agent_tool WHERE assistant_id = ?::uuid
ASSISTANT.TOOL.ADD=INSERT INTO assistant_agent_tool (assistant_id, tool_id) VALUES (?::uuid, ?::uuid) ON CONFLICT DO NOTHING
ASSISTANT.TOOL.FIND_IDS=SELECT tool_id FROM assistant_agent_tool WHERE assistant_id = ?::uuid

TOOL_AUTH.CREATE=INSERT INTO tool_auth_profile (name, description, auth_type, auth_config, encrypted_client_secret, token_url, scopes, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
TOOL_AUTH.FIND_ALL=SELECT * FROM tool_auth_profile ORDER BY created_at ASC
TOOL_AUTH.FIND_BY_ID=SELECT * FROM tool_auth_profile WHERE id = ?::uuid
TOOL_AUTH.UPDATE=UPDATE tool_auth_profile SET name = ?, description = ?, auth_type = ?, auth_config = ?, encrypted_client_secret = ?, token_url = ?, scopes = ?, updated_at = ? WHERE id = ?::uuid
TOOL_AUTH.UPDATE_TOKEN=UPDATE tool_auth_profile SET encrypted_access_token = ?, token_expires_at = ?, updated_at = ? WHERE id = ?::uuid
TOOL_AUTH.DELETE=DELETE FROM tool_auth_profile WHERE id = ?::uuid

SKILL.CREATE=INSERT INTO agent_skill (assistant_id, name, description, blob_prefix, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?)
SKILL.FIND_BY_ID=SELECT * FROM agent_skill WHERE id = ?::uuid
SKILL.FIND_BY_ASSISTANT=SELECT * FROM agent_skill WHERE assistant_id = ?::uuid ORDER BY created_at ASC
SKILL.FIND_ENABLED_BY_ASSISTANT=SELECT * FROM agent_skill WHERE assistant_id = ?::uuid AND enabled = TRUE ORDER BY created_at ASC
SKILL.UPDATE=UPDATE agent_skill SET name = ?, description = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
SKILL.DELETE=DELETE FROM agent_skill WHERE id = ?::uuid

CHAT.TOOL_EVENT.CREATE=INSERT INTO chat_tool_event (session_id, turn_index, seq, call_id, tool_name, tool_input, tool_output, is_error, created_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?, ?, ?)
CHAT.TOOL_EVENT.FIND_BY_SESSION=SELECT * FROM chat_tool_event WHERE session_id = ?::uuid ORDER BY turn_index ASC, seq ASC
CHAT.TOOL_EVENT.DELETE_FROM_TURN=DELETE FROM chat_tool_event WHERE session_id = ?::uuid AND turn_index >= ?
