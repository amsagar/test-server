CHAT.SESSION.CREATE=INSERT INTO chat_session (title, assistant_id, created_at, updated_at) VALUES (?, ?::uuid, ?, ?)
CHAT.SESSION.FIND_BY_ARCHIVED=SELECT * FROM chat_session WHERE archived = ? ORDER BY updated_at DESC
CHAT.SESSION.FIND_BY_ID=SELECT * FROM chat_session WHERE id = ?::uuid
CHAT.SESSION.UPDATE_TITLE=UPDATE chat_session SET title = ?, updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.UPDATE_ARCHIVED=UPDATE chat_session SET archived = ?, updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.TOUCH=UPDATE chat_session SET updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.UPDATE_STYLE=UPDATE chat_session SET style_id = ?::uuid, updated_at = ? WHERE id = ?::uuid
CHAT.SESSION.DELETE=DELETE FROM chat_session WHERE id = ?::uuid

STYLE.CREATE=INSERT INTO response_style (name, description, instructions, created_at, updated_at) VALUES (?, ?, ?, ?, ?)
STYLE.FIND_ALL=SELECT * FROM response_style ORDER BY created_at ASC
STYLE.FIND_BY_ID=SELECT * FROM response_style WHERE id = ?::uuid
STYLE.UPDATE=UPDATE response_style SET name = ?, description = ?, instructions = ?, updated_at = ? WHERE id = ?::uuid
STYLE.DELETE=DELETE FROM response_style WHERE id = ?::uuid
STYLE.COUNT=SELECT COUNT(*) FROM response_style

ASSISTANT.CREATE=INSERT INTO assistant (name, system_prompt, builtin_tools, created_at, updated_at) VALUES (?, ?, ?, ?, ?)
ASSISTANT.FIND_ALL=SELECT * FROM assistant ORDER BY created_at ASC
ASSISTANT.FIND_BY_ID=SELECT * FROM assistant WHERE id = ?::uuid
ASSISTANT.FIND_BY_NAME=SELECT * FROM assistant WHERE name = ?
ASSISTANT.UPDATE=UPDATE assistant SET name = ?, system_prompt = ?, builtin_tools = ?, updated_at = ? WHERE id = ?::uuid
ASSISTANT.DELETE=DELETE FROM assistant WHERE id = ?::uuid

TOOL.CREATE=INSERT INTO agent_tool (assistant_id, name, description, method, host, endpoint, request_schema, source_type, auth_profile_id, auth_type, auth_config, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?, ?, ?::uuid, ?, ?, ?, ?, ?)
TOOL.FIND_BY_ID=SELECT * FROM agent_tool WHERE id = ?::uuid
TOOL.FIND_BY_ASSISTANT=SELECT * FROM agent_tool WHERE assistant_id = ?::uuid ORDER BY created_at ASC
TOOL.FIND_ENABLED_BY_ASSISTANT=SELECT * FROM agent_tool WHERE assistant_id = ?::uuid AND enabled = TRUE ORDER BY created_at ASC
TOOL.UPDATE=UPDATE agent_tool SET name = ?, description = ?, method = ?, host = ?, endpoint = ?, request_schema = ?, auth_profile_id = ?::uuid, auth_type = ?, auth_config = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
TOOL.DELETE=DELETE FROM agent_tool WHERE id = ?::uuid
TOOL.FIND_EMBEDDING_HASH=SELECT embedding_hash FROM agent_tool WHERE id = ?::uuid
TOOL.UPDATE_EMBEDDING=UPDATE agent_tool SET embedding = ?::vector, embedding_hash = ? WHERE id = ?::uuid
TOOL.FIND_MISSING_EMBEDDING=SELECT id, name, description FROM agent_tool WHERE embedding IS NULL
TOOL.SIMILARITY_BY_ASSISTANT=SELECT t.name AS name, 1 - (t.embedding <=> ?::vector) AS score FROM agent_tool t WHERE t.assistant_id = ?::uuid AND t.enabled = TRUE AND t.embedding IS NOT NULL

TOOL_AUTH.CREATE=INSERT INTO tool_auth_profile (name, description, auth_type, auth_config, encrypted_client_secret, token_url, scopes, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
TOOL_AUTH.FIND_ALL=SELECT * FROM tool_auth_profile ORDER BY created_at ASC
TOOL_AUTH.FIND_BY_ID=SELECT * FROM tool_auth_profile WHERE id = ?::uuid
TOOL_AUTH.UPDATE=UPDATE tool_auth_profile SET name = ?, description = ?, auth_type = ?, auth_config = ?, encrypted_client_secret = ?, token_url = ?, scopes = ?, updated_at = ? WHERE id = ?::uuid
TOOL_AUTH.UPDATE_TOKEN=UPDATE tool_auth_profile SET encrypted_access_token = ?, token_expires_at = ?, updated_at = ? WHERE id = ?::uuid
TOOL_AUTH.DELETE=DELETE FROM tool_auth_profile WHERE id = ?::uuid

SKILL.CREATE=INSERT INTO agent_skill (assistant_id, name, description, blob_prefix, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?)
SKILL.FIND_BY_ID=SELECT * FROM agent_skill WHERE id = ?::uuid
SKILL.FIND_BY_ASSISTANT=SELECT * FROM agent_skill WHERE assistant_id = ?::uuid ORDER BY created_at ASC
SKILL.FIND_ENABLED_BY_ASSISTANT=SELECT * FROM agent_skill WHERE assistant_id = ?::uuid AND enabled = TRUE ORDER BY created_at ASC
SKILL.UPDATE=UPDATE agent_skill SET name = ?, description = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
SKILL.DELETE=DELETE FROM agent_skill WHERE id = ?::uuid

DOCUMENT.CREATE=INSERT INTO agent_document (assistant_id, name, blob_prefix, chunk_count, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?)
DOCUMENT.FIND_BY_ID=SELECT * FROM agent_document WHERE id = ?::uuid
DOCUMENT.FIND_BY_ASSISTANT=SELECT * FROM agent_document WHERE assistant_id = ?::uuid ORDER BY created_at ASC
DOCUMENT.COUNT_BY_ASSISTANT=SELECT COUNT(*) FROM agent_document WHERE assistant_id = ?::uuid AND enabled = TRUE
DOCUMENT.UPDATE=UPDATE agent_document SET name = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
DOCUMENT.UPDATE_CHUNK_COUNT=UPDATE agent_document SET chunk_count = ?, updated_at = ? WHERE id = ?::uuid
DOCUMENT.DELETE=DELETE FROM agent_document WHERE id = ?::uuid

CHAT.TOOL_EVENT.CREATE=INSERT INTO chat_tool_event (session_id, turn_index, seq, call_id, tool_name, tool_input, tool_output, is_error, created_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?, ?, ?)
CHAT.TOOL_EVENT.FIND_BY_SESSION=SELECT * FROM chat_tool_event WHERE session_id = ?::uuid ORDER BY turn_index ASC, seq ASC
CHAT.TOOL_EVENT.DELETE_FROM_TURN=DELETE FROM chat_tool_event WHERE session_id = ?::uuid AND turn_index >= ?

MCP.SERVER.CREATE=INSERT INTO mcp_server (assistant_id, name, description, transport, url, sse_endpoint, auth_type, auth_config, encrypted_secret, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
MCP.SERVER.FIND_BY_ID=SELECT * FROM mcp_server WHERE id = ?::uuid
MCP.SERVER.FIND_BY_ASSISTANT=SELECT * FROM mcp_server WHERE assistant_id = ?::uuid ORDER BY created_at ASC
MCP.SERVER.FIND_ENABLED_BY_ASSISTANT=SELECT * FROM mcp_server WHERE assistant_id = ?::uuid AND enabled = TRUE ORDER BY created_at ASC
MCP.SERVER.UPDATE=UPDATE mcp_server SET name = ?, description = ?, transport = ?, url = ?, sse_endpoint = ?, auth_type = ?, auth_config = ?, encrypted_secret = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
MCP.SERVER.UPDATE_STATUS=UPDATE mcp_server SET status = ?, status_detail = ?, updated_at = ? WHERE id = ?::uuid
MCP.SERVER.UPDATE_TOKEN=UPDATE mcp_server SET encrypted_access_token = ?, token_expires_at = ?, updated_at = ? WHERE id = ?::uuid
MCP.SERVER.DELETE=DELETE FROM mcp_server WHERE id = ?::uuid

MCP.TOOL.UPSERT=INSERT INTO mcp_server_tool (server_id, name, description, input_schema, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, TRUE, ?, ?) ON CONFLICT (server_id, name) DO UPDATE SET description = EXCLUDED.description, input_schema = EXCLUDED.input_schema, updated_at = EXCLUDED.updated_at
MCP.TOOL.FIND_BY_ID=SELECT * FROM mcp_server_tool WHERE id = ?::uuid
MCP.TOOL.FIND_BY_SERVER=SELECT * FROM mcp_server_tool WHERE server_id = ?::uuid ORDER BY name ASC
MCP.TOOL.FIND_ENABLED_BY_SERVER=SELECT * FROM mcp_server_tool WHERE server_id = ?::uuid AND enabled = TRUE ORDER BY name ASC
MCP.TOOL.SET_ENABLED=UPDATE mcp_server_tool SET enabled = ?, updated_at = ? WHERE id = ?::uuid
MCP.TOOL.DELETE_BY_SERVER=DELETE FROM mcp_server_tool WHERE server_id = ?::uuid
