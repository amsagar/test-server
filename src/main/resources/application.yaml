spring:
  application:
    name: codingagent
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://psql-server-eus-ivoyant-global-spoke-nprd.postgres.database.azure.com:5432/pods_ai_agent?sslmode=require&tcpKeepAlive=true&connectTimeout=10&socketTimeout=60
    username: psqladminuser
    password: pU9_hvM2XRyDHTVRdeAd
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql-models/vector-store-model.sql
        - classpath:sql-models/chat-session-model.sql
        - classpath:sql-models/assistant-model.sql
        - classpath:sql-models/agent-tool-model.sql
        - classpath:sql-models/tool-embedding-model.sql
        - classpath:sql-models/agent-skill-model.sql
        - classpath:sql-models/agent-document-model.sql
        - classpath:sql-models/chat-tool-event-model.sql
        - classpath:sql-models/response-style-model.sql
        - classpath:sql-models/mcp-server-model.sql
  ai:
    azure:
      openai:
        api-key: 6P1vmDOsmn4ZmAvat7DhqSBtNZYVMNa0j26yaSZJNlb8iYGtb2mSJQQJ99CEACHYHv6XJ3w3AAAAACOGgt1l
        endpoint: https://aif-eu2-ov-np-01.openai.azure.com
        chat:
          options:
            deployment-name: gpt-5.2-chat
        embedding:
          options:
            deployment-name: text-embedding-3-large
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        # We create the vector_store table ourselves via spring.sql.init
        # (classpath:sql-models/vector-store-model.sql) using only the allow-listed `vector`
        # extension. Spring AI's own init is left off because it also runs `CREATE EXTENSION hstore`,
        # which Azure Database for PostgreSQL rejects unless hstore is allow-listed via the
        # `azure.extensions` server parameter (hstore is never used at runtime — metadata is JSON).
        initialize-schema: false
        # text-embedding-3-large yields 3072-dim vectors; pgvector's hnsw/ivfflat ANN indexes
        # cap at 2000 dims, so we run with no vector index (sequential scan + metadata filter).
        index-type: NONE
        dimensions: 3072
        distance-type: COSINE_DISTANCE
azure:
  storage:
    blob:
      connection-string: "DefaultEndpointsProtocol=https;AccountName=openfga;AccountKey=3qRPjRUAleZDRiDuHaZxCcrPFLAABAeLK/lSIuIDPTTo1CBgnzFIg+TvPvynr1sL5EtL7aIofTix+AStN2labg==;EndpointSuffix=core.windows.net"
      skills-container: agent-skills
      documents-container: agent-documents

agent:
  # When true, each user message is first classified against the selected assistant's role; off-topic
  # messages are blocked with a short redirect instead of reaching the main model. See ScopeGuardService.
  scope-guard:
    enabled: true
